<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Corporate Desk | Kridiya Business Travel</title>
<meta name="description" content="Contact Kridiya Business Travel corporate desk for UAE and international company travel support.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32"><link rel="stylesheet" href="css/corporate.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <section class="section">
    <div class="container split">
      <div>
        <p class="brand-line">Contact corporate desk</p>
        <h1>For urgent company travel, WhatsApp is fastest.</h1>
        <p class="lede">Reach Kridiya for employee flights, business visas, UAE guest visas, hotels, transfers, MICE, VIP travel, emergency changes, Umrah groups, and monthly reporting.</p>
        <div class="hero-actions">
          <a class="btn btn-wa btn-lg" href="https://wa.me/971509413873?text=Hello%20Kridiya%20Business%20Travel%2C%20I%20need%20corporate%20travel%20support." target="_blank" rel="noopener">WhatsApp +971 50 941 3873</a>
          <a class="btn btn-primary btn-lg" href="mailto:corporate@kridiyatravel.com">corporate@kridiyatravel.com</a>
        </div>
      </div>
      <div class="form-card">
        <form class="form-grid" data-corporate-form data-prefix="CON">
          <input type="hidden" name="Request_type" value="Corporate contact request">
          <div class="field-row">
            <div class="field col-6"><label>Name</label><input name="Name" required placeholder="Full name"></div>
            <div class="field col-6"><label>Company</label><input name="Company_name" required placeholder="Company name"></div>
            <div class="field col-6"><label>Email</label><input name="Email" type="email" required placeholder="name@company.com"></div>
            <div class="field col-6"><label>Phone</label><input name="Phone" required placeholder="+971 ..."></div>
            <div class="field"><label>Message</label><textarea name="Message" required placeholder="Tell us what your company needs."></textarea></div>
          </div>
          <button class="btn btn-primary btn-lg" type="submit">Send message</button>
          <div data-form-status></div>
        </form>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer" class="footer"></footer>
<script src="js/corporate.js" defer></script>
</body>
</html>
